name: Bug
description: Something does not work as CONTEXT.md describes
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Use glossary terms (Location, Visit, Access Code, Password, Admin).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Route
      placeholder: /  /login  /admin
